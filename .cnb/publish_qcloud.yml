main:
  push:
    - name: push自动发布
      stages:
        - name: trigger by push
          type: cnb:apply
          options:
            title: 触发发布流水线-push
            event: api_trigger_deploy
            sync: true
            continueOnBuildError: false
  web_trigger_deploy: &deploy_pipeline
    - services:
        - docker
      imports:
        - https://cnb.cool/smartworkflow/environment/-/blob/main/qcloud-tools-release/cnb_envs.yml
        - https://cnb.cool/smartworkflow/environment/-/blob/main/qcloud-tools-release/qcloud_envs.yml
      stages:
        - name: 构建并推送镜像
          script:
            - docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT} .
            - docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}
        - name: 发布到 tke
          image: tencentcom/deploy-to-tke
          settings:
            secret_id: ${QCLOUD_SECRET_ID}
            secret_key: ${QCLOUD_SECRET_KEY}
            region: ap-guangzhou
            cluster_id: cls-1coqvnh4
            namespace: cert-monitor
            workload_kind: cronjob
            workload_name: cert-monitor
            container_names: cert-monitor
            container_images: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}
  api_trigger_deploy: *deploy_pipeline
